name: dalsauto-publish
on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # 15분마다(정각대는 GitHub가 자주 건너뜀). 공개 저장소라 실행 분량 무제한
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # 알림(휴대폰 앱 푸시)용 이슈 댓글
concurrency:
  group: dalsauto-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (커밋 고정: 태그가 바뀌어도 코드가 바뀌지 않게)
        with:
          ref: main  # 대기하던 실행이 트리거 시점의 낡은 상태 파일을 쓰지 않게 항상 최신 main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: 암호화 라이브러리
        run: pip install --quiet cryptography==50.0.2
      - name: 발행·측정
        env:
          DALSAUTO_THREADS_TOKEN: ${{ secrets.DALSAUTO_THREADS_TOKEN }}
          NOTIFY_MENTION: ${{ github.repository_owner }}
        run: python publish.py
      - name: 결과 저장
        run: |
          git config user.name "dalsauto-bot"
          git config user.email "dalsauto-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push || true
      - name: 알림(휴대폰 앱 푸시)
        if: ${{ hashFiles('notify.txt') != '' }}
        continue-on-error: true   # 알림이 실패해도 발행·상태 저장에는 영향 없음(이 단계는 맨 마지막)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: bash notify.sh notify.txt
